<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Plein écran sur les navigateurs modernes (Brave, Chrome, etc.) -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Conservé pour le plein écran sur iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>MAEL Scan</title>
  <link rel="stylesheet" href="style.css">

  <!-- Import map : permet d'utiliser "import ... from 'qr-scanner'" -->
  <script type="importmap">
  {
    "imports": {
      "qr-scanner": "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js"
    }
  }
  </script>
</head>
<body>

  <!-- Barre d'en-tête -->
  <header class="app-header">
    <!-- Drapeaux à gauche -->
    <img src="langues_32px.png" alt="Drapeaux" class="header-icon">

    <!-- Titre au centre -->
    <h1 class="header-title">MAEL Scan</h1>

    <!-- Version et QR code à droite -->
    <div class="header-right">
      <span class="header-version">V6.0</span>
      <img src="qr-scan-svgrepo-com.png" alt="QR Code" class="header-icon">
    </div>
  </header>


  <main class="app">

    <!-- Champ de texte multi-lignes (readonly, valeur initiale MAEL) -->
    <textarea
      id="result"
      class="result"
      readonly
      rows="1"
      wrap="soft"
      aria-label="Résultat du scan"
    >MAEL</textarea>

    <!-- Bouton 1 : ouvre la caméra et scanne (lecture normale) -->
    <button
      id="scanBtn"
      class="scan-btn"
      type="button"
      aria-label="Scanner un code QR (lecture normale)"
    >
      <img
        src="Scanner.png"
        alt="Scanner — appuyer pour lancer la caméra"
        class="scan-logo"
      >
    </button>

    <!-- Bouton 2 : relit le texte déjà présent à vitesse normale (sans scanner) -->
    <button
      id="RepetBtn"
      class="scan-btn"
      type="button"
      aria-label="Réécouter le texte affiché (lecture normale)"
    >
      <img
        src="Reecouter.png"
        alt="Réécouter — relire le texte affiché à vitesse normale"
        class="scan-logo"
      >
    </button>

    <!-- Arrêt de la lecture audio et de la synthèse vocale -->
    <button id="stopAudioBtn" class="stop-audio-btn" type="button" aria-label="Arrêter la lecture">■ Arrêter</button>

    <!-- Bouton 3 : relit lentement le texte déjà présent (sans scanner) -->
    <button
      id="SlowBtn"
      class="scan-btn"
      type="button"
      aria-label="Relire lentement le texte affiché"
    >
      <img
        src="Lent.png"
        alt="Mode lent — relire le texte affiché"
        class="scan-logo"
      >
    </button>

  </main>

  <!-- Pied de page -->
  <footer class="app-footer">
    <img src="logo_lvh_32px.png" alt="Logo LVH" class="footer-logo">
    <span class="footer-text">Auteur : Yonnel Bécognée - Licence GNU GPL V3</span>
  </footer>

  <!-- Overlay plein écran avec la vidéo de la caméra -->
  <div id="scanner-overlay" class="overlay hidden" aria-hidden="true">
    <video id="qr-video" class="video" playsinline muted></video>
    <button id="closeBtn" class="close-btn" type="button" aria-label="Fermer">×</button>
    <p class="hint">Pointez la caméra vers un code QR</p>
  </div>

  <!-- Modules MAEL : scripts classiques sur serveur statique, mêmes données/règles. -->
  <script src="lang_tts.js"></script>
  <script src="mode_msg_data.js"></script>
  <script src="mode_msg.js"></script>
  <script src="epel_tts.js"></script>
  <script src="qr_dto.js"></script>
  <script src="MAEL_obfus.js"></script>
  <script src="mael_modes.js"></script>
  <script src="dicter_tts.js"></script>
  <script src="qr_parse.js"></script>
  <script src="tts_setup.js"></script>
  <script src="tts_player.js"></script>
  <script src="tts_player_gtts.js"></script>
  <script src="mp3_read.js"></script>
  <script src="dico_url.js"></script>
  <script src="qr_scan.js"></script>
  <script src="scanner_factory.js"></script>
  <script src="wifi_setup.js"></script>
  <script src="mael_scan.js"></script>
  <script src="mael_Scan_gui.js"></script>
  <script type="module">
    import QrScanner from 'qr-scanner';
    globalThis.QrScanner = QrScanner;
    try {
      await import('./app.js');
    } catch (error) {
      console.error('Impossible de charger MAEL Scan ou qr-scanner.', error);
    }
  
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
