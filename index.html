<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Plein écran sur les navigateurs modernes (Brave, Chrome, etc.) -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Conservé pour le plein écran sur iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>MAEL Scan</title>
  <link rel="stylesheet" href="style.css">

  <!-- Import map : permet d'utiliser "import ... from 'qr-scanner'" -->
  <script type="importmap">
  {
    "imports": {
      "qr-scanner": "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js"
    }
  }
  </script>
</head>
<body>

  <main class="app">

    <!-- Champ de texte multi-lignes (readonly, valeur initiale MAEL) -->
    <textarea
      id="result"
      class="result"
      readonly
      rows="1"
      wrap="soft"
      aria-label="Résultat du scan"
    >MAEL</textarea>

    <!-- Bouton 1 : scan à vitesse normale (Scanner.png) -->
    <button
      id="scanBtn"
      class="scan-btn"
      type="button"
      aria-label="Scanner un code QR (lecture normale)"
    >
      <img
        src="Scanner.png"
        alt="Logo MAEL — appuyer pour scanner"
        class="scan-logo"
      >
    </button>

    <!-- Bouton 2 : scan à vitesse lente (Lent.png, rate 0.8) -->
    <button
      id="scanSlowBtn"
      class="scan-btn"
      type="button"
      aria-label="Scanner un code QR (lecture lente)"
    >
      <img
        src="Lent.png"
        alt="Mode lent — appuyer pour scanner"
        class="scan-logo"
      >
    </button>

  </main>

  <!-- Overlay plein écran avec la vidéo de la caméra -->
  <div id="scanner-overlay" class="overlay hidden" aria-hidden="true">
    <video id="qr-video" class="video" playsinline muted></video>
    <button id="closeBtn" class="close-btn" type="button" aria-label="Fermer">×</button>
    <p class="hint">Pointez la caméra vers un code QR</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
